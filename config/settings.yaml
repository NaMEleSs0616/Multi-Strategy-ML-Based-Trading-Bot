# Universe & data
universe:
  equities: [NVDA, AMD, META, GOOGL, MSFT]
  etfs: [QQQ, SPY, XLK]

data:
  provider: alpaca  # yfinance | alpaca
  sqlite_path: data/storage/market_data.db
  daily_interval: 1d
  intraday_intervals: [5m, 15m]
  yfinance_period: 2y
  intraday_period: 60d

strategies:
  pair: [NVDA, AMD]
  dynamic_pair_selection: false
  transaction_cost_bps: 5.0
  stat_arb_z_window: 20
  stat_arb_entry_z: 2.0
  vol_atr_window: 14
  vol_atr_mult: 1.5
  vol_lookback: 20
  mr_rsi_window: 14
  mr_bb_window: 20
  # Daily momentum (SMA crossover, long/short/flat) — beta-capture leg
  # added to fix the market-neutral bias and the 60-day intraday blindspot.
  enable_daily_momentum: true
  daily_momentum_fast_window: 50
  daily_momentum_slow_window: 200
  # Daily trend (SMA crossover, long-only). Complements daily_momentum by
  # encoding "uptrend or cash" with no short bias.
  enable_daily_trend: true
  daily_trend_fast_window: 50
  daily_trend_slow_window: 200
  # VIX fade — long on the primary equity when VIX > threshold AND VIX
  # rate-of-change has turned negative (panic subsiding). Requires
  # FRED_API_KEY; degrades to a zero-return inert leg without it.
  enable_vix_fade: true
  vix_fade_threshold: 25.0
  vix_fade_roc_lookback: 1
  # Cross-sectional momentum — long when ticker's 90-day ROC exceeds SPY's.
  enable_cross_sectional_mom: true
  cross_sectional_mom_lookback: 90
  # Fractional cointegration stat-arb (advanced long-memory spread MR)
  enable_fractional_stat_arb: true
  fractional_stat_arb_window: 252
  fractional_stat_arb_entry_z: 2.0
  fractional_stat_arb_exit_z: 0.5
  fractional_stat_arb_gph_m: 10
  fractional_stat_arb_d_max: 0.5
  # Variance risk premium harvesting (IV - RV) fade on SPY
  enable_vrp_harvesting: true
  vrp_rv_window: 30
  vrp_z_window: 252
  vrp_z_threshold: 2.0

# PiT feature engineering
features:
  frac_diff_d: 0.4
  frac_diff_thresh: 0.001
  autocorr_window: 20
  atr_window: 14
  pit_shift: 1  # mandatory shift for all rolling features
  include_macro: false
  include_sentiment: false

# Stage 1: xLSTM encoder (self-supervised next-step MSE)
xlstm:
  hidden_dim: 128
  num_blocks: 2
  dropout: 0.1
  sequence_length: 60
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 100
  val_fraction: 0.2
  plateau_patience: 5
  plateau_min_delta: 0.0001
  checkpoint_dir: models/xlstm/checkpoints
  export_embeddings: true
  yfinance_period: 2y
  synthetic_bars: 2500
  ou_gamma: 0.1
  ou_dt: 1.0

# Stage 2: PPO capital router
ppo:
  total_timesteps: 20000
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 64
  checkpoint_dir: models/ppo/checkpoints

# Fractional Kelly risk overlay
risk:
  enabled: true
  kelly_window: 30
  kelly_fraction: 0.5
  # Live/paper diversification cap: prevent any single strategy from cornering capital.
  max_single_weight_live: 0.60
  # Anti "Lazy Agent": when a leg's recent win-rate clears the threshold the
  # fractional Kelly is scaled up by ``momentum_boost`` and floored at
  # ``min_momentum_allocation``, so trending regimes stop being throttled to cash.
  min_momentum_allocation: 0.25
  momentum_win_rate_threshold: 0.55
  momentum_boost: 1.5

# RL routing
rl:
  embedding_dim: 64
  n_strategies: 9
  # Turnover penalty expressed in bps of notional reallocated.
  # This is intentionally tiny to prevent out-of-sample freezing.
  # Applied only to per-leg weight changes exceeding 5%.
  turnover_penalty_bps: 2.0
  turnover_weight_change_threshold: 0.05
  # Effective per-step turnover penalty = turnover_penalty_lambda * turnover_penalty_multiplier.
  # ``turnover_penalty_multiplier`` is a separate dial so operators can dampen
  # the penalty without changing the trained PPO checkpoint's reward scale.
  turnover_penalty_lambda: 0.1
  turnover_penalty_multiplier: 0.5
  # Composite reward = sortino_weight*Sortino + outperformance_weight*(R_p - R_SPY).
  sortino_weight: 0.5
  outperformance_weight: 0.5
  sortino_window: 30
  purge_embargo_bars: 5

# Global-to-Local orchestrator (scripts/run_orchestrator.py)
orchestrator:
  finetune_epochs: 20
  finetune_steps_per_epoch: 1024
  finetune_lr: 0.001

# Walk-forward validation
walk_forward:
  n_splits: 5
  min_train_size: 252
  test_size: 63
  smoke_n_steps: 500

# Execution
execution:
  mode: alpaca  # backtest | alpaca
  paper: true
  order_type: limit
  latency_bars: 1
  spread_bps: 5.0
  allow_market_orders: false

# Backtest
backtest:
  initial_cash: 100000.0
  rebalance_threshold: 0.05
  report_dir: backtesting/reports

# Unified artifact paths (used by CLI scripts AND orchestrator)
artifacts:
  root_dir: models/checkpoints
  ticker_policies_subdir: ticker_policies

# Diagnostics (dashboard / audit harness)
diagnostics:
  audit_n_bars: 120
  audit_seed: 42
